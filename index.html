          /* Individual Orbit Angles & Rotation Speeds */
    /* The Electrons */
    #div2, #div3, #div4, #div5, #div5, #div6 {
    position: absolute;
    top: 40vh;
    left: 40vw;
    width: 20vw;
    height: 20vw;
    background-color:#2bff00;
    border-radius: 50%;
    transform: translateX(-50%);

    transition: transform 0.3s ease, width 0.3s ease, height 3s ease, background-color 2s ease, border-radius 3s ease, translate 0.5s ease;
    }

    #div2{
    transform: rotateX(100deg) rotateY(60deg);
    animation: vibrate 0.5s linear infinite;
    width: 20vw;
    height: 20vw;
    }

    #div3{
    transform: rotateX(75deg) rotateY(100deg);
    animation: vibrate 0.75s linear infinite;
    width: 30vw;
    height: 30vw;
    }

    #div4{
    transform: rotateX(100deg) rotateY(20deg);
    animation: vibrate 1s linear infinite;
    width: 20vw;
    height: 20vw;
    }

    #div5{
    transform: rotateX(100deg) rotateY(20deg);
    animation: vibrate 1s linear infinite;
    width: 20vw;
    height: 20vw;
    }

    #div6{
    transform: rotateX(100deg) rotateY(20deg);
    animation: vibrate 1s linear infinite;
    width: 20vw;
    height: 20vw;
    }



    @keyframes vibrate {
    0% {
      transform: translate(0px, 0px) rotate(0deg);
      background-color:#2bff00;
      width: 20vw;
      height: 20vw;
    }
    20% {
      transform: translate(-100px, 30px) rotate(-10deg);
      background-color:rgb(0, 255, 247);
      width: 20vw;
      height: 20vw;
    }
    40% {
      transform: translate(20px, -10px) rotate(100deg);
      background-color:#00eeff;
      width: 30vw;
      height: 30vw;
    }
    60% {
      transform: translate(-100px, -40px) rotate(5deg);
      background-color:#00ffcc;
      width: 20vw;
      height: 20vw;
    }
    80% {
      transform: translate(50px, 20px) rotate(-10deg);
      background-color:#00ffbf;
      width: 30vw;
      height: 30vw;
    }
    100% {
      transform: translate(0px, 30px) rotate(10deg);
      background-color:#2bff00;
      width: 20vw;
      height: 20vw;
    }
    }
}

    @keyframes divRotate {
      0%{
        width: 200px;
        height: 600px;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
      }
      20%{
        rotate: 180deg;
        width: 100px;
        height: 300px;
        left: 0%;
        top: 0%;
        translate: 0%;
      }
      40%{
        rotate: 360deg;
        width: 50px;
        height: 150px;
        left:100%;
        top:0%;
        translate: 0%;
        
      }
      60%{
        rotate: 540deg;
        width: 100px;
        height: 300px;
        left: 0%;
        top: 80%;
        translate:0%;
        
      }
      80%{
        rotate: 720deg;
        width: 50px;
        height: 150px;
        left: 100%;
        top: 80%;
        translate: 0%;
        
      }
      100%{
        rotate: 1080deg;
        width: 200px;
        height: 600px;
        left: 50%;
        top: 50%;
        translate: -50% -50%;
        
      }
    }
     @keyframes boxpulsefirst {
      0%{
        rotate: 90deg;

      20%{

      60%{

      100%{

    @keyframes boxpulse {

      60%{

    @keyframes centershrink {
      0%{

      40%{

      }
      60%{
        scale:100%;

      80%{

      }

    @keyframes boxleft {
